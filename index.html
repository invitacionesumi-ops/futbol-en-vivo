<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#07111F">
  <title>DiagnÃ³stico HLS</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root{--bg:#07111F;--surface:#102338;--surface2:#16304D;--primary:#16C784;--danger:#FF5C5C;--warn:#FFCC66;--text:#fff;--muted:#AFC0D3;--border:#24425F}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    .app{max-width:1000px;margin:auto;padding:14px}.header{display:flex;gap:12px;align-items:center;margin-bottom:14px}
    .logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--primary);color:#00150d;font-weight:900}
    h1{margin:0;font-size:28px}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:10px;margin-bottom:14px}
    .video-wrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:13px;overflow:hidden}
    video{width:100%;height:100%;background:#000}.title{font-size:20px;font-weight:800;margin:12px 4px 4px}.meta{color:var(--muted);font-size:13px;margin:0 4px 10px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px;cursor:pointer}
    .primary{background:var(--primary);color:#00150d}.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .streams{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}.stream{background:var(--surface2);color:var(--text);border:1px solid var(--border);text-align:left}
    .stream.active{background:var(--primary);color:#00150d}.stream-name{font-size:16px;font-weight:800}.stream-meta{font-size:12px;opacity:.8;margin-top:4px}
    .row{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}.label{color:var(--muted);font-weight:700}.value{word-break:break-word}
    .ok{color:var(--primary)}.bad{color:var(--danger)}.warn{color:var(--warn)}
    #log{background:#050B12;border:1px solid var(--border);border-radius:12px;padding:10px;min-height:160px;max-height:320px;overflow:auto;white-space:pre-wrap;font-family:monospace;font-size:12px;color:#D7E3EE}
    @media(min-width:700px){.streams{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main class="app">
  <div class="header"><div class="logo">â–¶</div><div><h1>DiagnÃ³stico HLS</h1><p class="sub">Para detectar por quÃ© un stream funciona en PC y falla en Android.</p></div></div>

  <section class="card">
    <div class="video-wrap"><video id="video" controls playsinline preload="metadata"></video></div>
    <div id="currentMatch" class="title">SeleccionÃ¡ un stream</div>
    <div id="currentMeta" class="meta">Esperando pruebaâ€¦</div>
    <div class="actions">
      <button id="reloadBtn" class="primary">â†» Reintentar</button>
      <button id="clearBtn" class="secondary">Limpiar diagnÃ³stico</button>
    </div>
  </section>

  <section id="streams" class="streams"></section>

  <section class="card">
    <h2>DiagnÃ³stico</h2>
    <div class="row"><div class="label">Navegador:</div><div id="browserInfo" class="value"></div></div>
    <div class="row"><div class="label">Hls.js:</div><div id="hlsSupport" class="value"></div></div>
    <div class="row"><div class="label">Estado:</div><div id="status" class="value">Sin iniciar</div></div>
    <div class="row"><div class="label">Tipo de error:</div><div id="errorType" class="value">â€”</div></div>
    <div class="row"><div class="label">Detalle:</div><div id="errorDetails" class="value">â€”</div></div>
    <div class="row"><div class="label">CÃ³digo HTTP:</div><div id="httpCode" class="value">â€”</div></div>
    <div class="row"><div class="label">URL afectada:</div><div id="errorUrl" class="value">â€”</div></div>
    <div class="row"><div class="label">Fatal:</div><div id="fatalValue" class="value">â€”</div></div>
    <h3>Registro tÃ©cnico</h3>
    <div id="log"></div>
  </section>
</main>

<script>
const STREAMS=[
  {name:"Prueba HLS Â· Big Buck Bunny",competition:"Mux Â· Demo pÃºblica",time:"PRUEBA",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
  {name:"Dock Sud - Armenio",competition:"LIVE",time:"EN VIVO",url:"https://jn304.sportvideodata.com/16243046082747529029_gZkNmYxMTNlBDZmZTLiljN50SZyQDNtYzNyQTLxQzYmRWYmRzL1JnLpBXYzRncvB3cu8WZklmd/output-0.m3u8"}
];

const video=document.getElementById("video"), streamsEl=document.getElementById("streams"), currentMatch=document.getElementById("currentMatch"), currentMeta=document.getElementById("currentMeta");
const browserInfo=document.getElementById("browserInfo"), hlsSupport=document.getElementById("hlsSupport"), statusEl=document.getElementById("status"), errorType=document.getElementById("errorType"), errorDetails=document.getElementById("errorDetails"), httpCode=document.getElementById("httpCode"), errorUrl=document.getElementById("errorUrl"), fatalValue=document.getElementById("fatalValue"), logEl=document.getElementById("log");
const reloadBtn=document.getElementById("reloadBtn"), clearBtn=document.getElementById("clearBtn");
let hls=null,currentIndex=null;

browserInfo.textContent=navigator.userAgent;
hlsSupport.textContent=Hls.isSupported()?"SÃ­ Â· Media Source disponible":"No";
hlsSupport.className="value "+(Hls.isSupported()?"ok":"bad");

function log(msg,obj){
  const now=new Date().toLocaleTimeString();
  let line=`[${now}] ${msg}`;
  if(obj){try{line+="\n"+JSON.stringify(obj,null,2)}catch(e){line+="\n"+String(obj)}}
  logEl.textContent+=line+"\n\n"; logEl.scrollTop=logEl.scrollHeight;
}
function resetDiag(){statusEl.textContent="Sin iniciar";statusEl.className="value";errorType.textContent="â€”";errorDetails.textContent="â€”";httpCode.textContent="â€”";errorUrl.textContent="â€”";fatalValue.textContent="â€”";}
function setActive(index){document.querySelectorAll(".stream").forEach((el,i)=>el.classList.toggle("active",i===index));}
function destroyPlayer(){if(hls){hls.destroy();hls=null} video.pause();video.removeAttribute("src");video.load();}
function showError(data){
  errorType.textContent=data.type||"â€”";errorDetails.textContent=data.details||"â€”";fatalValue.textContent=String(!!data.fatal);
  const r=data.response||{},n=data.networkDetails||{};
  httpCode.textContent=r.code||r.status||n.status||n.statusCode||"â€”";
  errorUrl.textContent=data.url||r.url||n.responseURL||n.url||"â€”";
}
function playStream(index){
  const item=STREAMS[index]; if(!item)return;
  currentIndex=index;setActive(index);resetDiag();destroyPlayer();
  currentMatch.textContent=item.name;currentMeta.textContent=[item.competition,item.time].filter(Boolean).join(" â€¢ ");
  statusEl.textContent="Cargando manifiestoâ€¦";statusEl.className="value warn";
  log("Iniciando stream: "+item.name);log("URL: "+item.url);

  if(Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:20,maxBufferLength:30,maxMaxBufferLength:60,fragLoadingTimeOut:20000,manifestLoadingTimeOut:20000,levelLoadingTimeOut:20000});
    hls.loadSource(item.url);hls.attachMedia(video);

    hls.on(Hls.Events.MEDIA_ATTACHED,()=>log("MEDIA_ATTACHED"));
    hls.on(Hls.Events.MANIFEST_LOADING,(e,d)=>log("MANIFEST_LOADING",{url:d.url}));
    hls.on(Hls.Events.MANIFEST_LOADED,(e,d)=>{statusEl.textContent="Manifiesto cargado";statusEl.className="value ok";log("MANIFEST_LOADED",{url:d.url,levels:d.levels?d.levels.length:undefined})});
    hls.on(Hls.Events.MANIFEST_PARSED,(e,d)=>{statusEl.textContent="Manifest parseado Â· iniciando reproducciÃ³n";statusEl.className="value ok";log("MANIFEST_PARSED",{levels:d.levels?d.levels.length:undefined,audioTracks:d.audioTracks?d.audioTracks.length:undefined});video.play().catch(err=>log("video.play() rechazado",{name:err.name,message:err.message}))});
    hls.on(Hls.Events.LEVEL_LOADED,(e,d)=>log("LEVEL_LOADED",{live:d.details?d.details.live:undefined,totalduration:d.details?d.details.totalduration:undefined}));
    hls.on(Hls.Events.FRAG_LOADING,(e,d)=>log("FRAG_LOADING",{url:d.frag?d.frag.url:undefined,sn:d.frag?d.frag.sn:undefined}));
    hls.on(Hls.Events.FRAG_LOADED,(e,d)=>log("FRAG_LOADED",{url:d.frag?d.frag.url:undefined,sn:d.frag?d.frag.sn:undefined}));

    hls.on(Hls.Events.ERROR,(e,data)=>{
      showError(data);
      log("HLS ERROR",{type:data.type,details:data.details,fatal:data.fatal,url:data.url,response:data.response?{code:data.response.code,text:data.response.text,url:data.response.url}:undefined});
      statusEl.textContent=`Error: ${data.type||"desconocido"} / ${data.details||"sin detalle"}`;statusEl.className="value bad";
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR){log("Error de red fatal. Intentando hls.startLoad()");setTimeout(()=>{try{hls.startLoad()}catch(err){log("FallÃ³ startLoad()",{name:err.name,message:err.message})}},1200);}
        else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){log("Error de media fatal. Intentando recoverMediaError()");setTimeout(()=>{try{hls.recoverMediaError()}catch(err){log("FallÃ³ recoverMediaError()",{name:err.name,message:err.message})}},1200);}
        else{log("Error fatal no recuperable automÃ¡ticamente");}
      }
    });

  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    log("Usando HLS nativo del navegador");video.src=item.url;
    video.addEventListener("loadedmetadata",()=>{statusEl.textContent="Metadata cargada por HLS nativo";statusEl.className="value ok";video.play().catch(()=>{})},{once:true});
    video.addEventListener("error",()=>{const err=video.error;statusEl.textContent="Error de video nativo";statusEl.className="value bad";log("VIDEO ERROR NATIVO",{code:err?err.code:undefined,message:err?err.message:undefined})},{once:true});
  } else {statusEl.textContent="El navegador no soporta HLS";statusEl.className="value bad";}
}

STREAMS.forEach((item,index)=>{
  const btn=document.createElement("button");btn.className="stream";btn.type="button";
  btn.innerHTML=`<div class="stream-name">${item.name}</div><div class="stream-meta">${item.competition} â€¢ ${item.time}</div>`;
  btn.addEventListener("click",()=>playStream(index));streamsEl.appendChild(btn);
});
reloadBtn.addEventListener("click",()=>{if(currentIndex===null){statusEl.textContent="ElegÃ­ primero un stream";return}playStream(currentIndex)});
clearBtn.addEventListener("click",()=>{logEl.textContent="";resetDiag()});
</script>
</body>
</html>
